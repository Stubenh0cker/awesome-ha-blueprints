# Blueprint metadata
blueprint:
  name: Controller - Philips 8719514440937/8719514440999 Hue Tap Dial Switch
  description: |
    # Controller - Philips 8719514440937/8719514440999 Hue Tap Dial Switch

    Controller automation for executing any kind of action triggered by the provided Philips 8719514440937/8719514440999 Hue Tap Dial Switch. Allows to optionally loop an action on a button long press.
    Supports Zigbee2MQTT.

    Automations created with this blueprint can be connected with one or more [Hooks](https://epmatt.github.io/awesome-ha-blueprints/docs/blueprints/hooks) supported by this controller.
    Hooks allow to easily create controller-based automations for interacting with media players, lights, covers and more.
    See the list of [Hooks available for this controller](https://epmatt.github.io/awesome-ha-blueprints/docs/blueprints/controllers/philips_8719514440937_8719514440999#available-hooks) for additional details.

    ## More Info

    ℹ️ Version 2026.02.09
    📕 Full documentation regarding this blueprint is available [here](https://epmatt.github.io/awesome-ha-blueprints/docs/blueprints/controllers/philips_8719514440937_8719514440999).

    🚀 This blueprint is part of the **[Awesome HA Blueprints](https://epmatt.github.io/awesome-ha-blueprints) project**. Please consider **[leaving a star on GitHub](https://github.com/EPMatt/awesome-ha-blueprints)**! 🌟

  source_url: https://github.com/EPMatt/awesome-ha-blueprints/blob/main/blueprints/controllers/philips_8719514440937_8719514440999/philips_8719514440937_8719514440999.yaml
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    integration:
      name: (Required) Integration
      description: Integration used for connecting the remote with Home Assistant. Select one of the available values.
      selector:
        select:
          options:
            - Zigbee2MQTT
    controller_device:
      name: (Zigbee2MQTT Required) Controller Device
      description: The controller device to use for the automation. Choose a value only if the remote is integrated with Zigbee2MQTT.
      default: ''
      selector:
        device:
          filter:
            # source: https://www.zigbee2mqtt.io/devices/8719514440937_8719514440999.html
            - integration: mqtt
              manufacturer: Philips
              model: Hue Tap dial switch
            # For backwards compatibility with z2m 1.x. model_id is added to end of model rather than a separate attribute in z2m 2.x
            - integration: mqtt
              manufacturer: Philips
              model: Hue Tap dial switch (8719514440937/8719514440999)
          multiple: false
    helper_last_controller_event:
      name: (Required) Helper - Last Controller Event
      description: Input Text used to store the last event fired by the controller. You will need to manually create a text input entity for this, please read the blueprint Additional Notes for more info.
      default: ''
      selector:
        entity:
          domain: input_text
    # inputs for custom actions
    action_button_1_short:
      name: (Optional) Button 1 short press
      description: Action to run on short button 1 press.
      default: []
      selector:
        action:
    action_button_1_long:
      name: (Optional) Button 1 long press
      description: Action to run on long button 1 press.
      default: []
      selector:
        action:
    action_button_1_release:
      name: (Optional) Button 1 release
      description: Action to run on button 1 release after long press.
      default: []
      selector:
        action:
    action_button_1_double:
      name: (Optional) (Virtual) Button 1 double press
      description: Action to run on double button 1 press.
      default: []
      selector:
        action:
    action_button_2_short:
      name: (Optional) Button 2 short press
      description: Action to run on short button 2 press.
      default: []
      selector:
        action:
    action_button_2_long:
      name: (Optional) Button 2 long press
      description: Action to run on long button 2 press.
      default: []
      selector:
        action:
    action_button_2_release:
      name: (Optional) Button 2 release
      description: Action to run on button 2 release after long press.
      default: []
      selector:
        action:
    action_button_2_double:
      name: (Optional) (Virtual) Button 2 double press
      description: Action to run on double button 2 press.
      default: []
      selector:
        action:
    action_button_3_short:
      name: (Optional) Button 3 short press
      description: Action to run on short button 3 press.
      default: []
      selector:
        action:
    action_button_3_long:
      name: (Optional) Button 3 long press
      description: Action to run on long button 3 press.
      default: []
      selector:
        action:
    action_button_3_release:
      name: (Optional) Button 3 release
      description: Action to run on button 3 release after long press.
      default: []
      selector:
        action:
    action_button_3_double:
      name: (Optional) (Virtual) Button 3 double press
      description: Action to run on double button 3 press.
      default: []
      selector:
        action:
    action_button_4_short:
      name: (Optional) Button 4 short press
      description: Action to run on short button 4 press.
      default: []
      selector:
        action:
    action_button_4_long:
      name: (Optional) Button 4 long press
      description: Action to run on long button 4 press.
      default: []
      selector:
        action:
    action_button_4_release:
      name: (Optional) Button 4 release
      description: Action to run on button 4 release after long press.
      default: []
      selector:
        action:
    action_button_4_double:
      name: (Optional) (Virtual) Button 4 double press
      description: Action to run on double button 4 press.
      default: []
      selector:
        action:
    action_dial_rotate_left_step:
      name: (Optional) Dial rotate left step
      description: Action to run on dial rotate left step.
      default: []
      selector:
        action:
    action_dial_rotate_left_slow:
      name: (Optional) Dial rotate left slow
      description: Action to run on dial rotate left slow.
      default: []
      selector:
        action:
    action_dial_rotate_left_fast:
      name: (Optional) Dial rotate left fast
      description: Action to run on dial rotate left fast.
      default: []
      selector:
        action:
    action_dial_rotate_right_step:
      name: (Optional) Dial rotate right step
      description: Action to run on dial rotate right step.
      default: []
      selector:
        action:
    action_dial_rotate_right_slow:
      name: (Optional) Dial rotate right slow
      description: Action to run on dial rotate right slow.
      default: []
      selector:
        action:
    action_dial_rotate_right_fast:
      name: (Optional) Dial rotate right fast
      description: Action to run on dial rotate right fast.
      default: []
      selector:
        action:
    # inputs for looping custom actions on long button press events until the corresponding release event is received
    button_1_long_loop:
      name: (Optional) Button 1 long press - loop until release
      description: Loop the button 1 action until the button is released.
      default: false
      selector:
        boolean:
    button_1_long_max_loop_repeats:
      name: (Optional) Button 1 long press - Maximum loop repeats
      description: >-
        Maximum number of repeats for the custom action, when looping is enabled.
        Use it as a safety limit to prevent an endless loop in case the corresponding stop event is not received.
      default: 500
      selector:
        number:
          min: 1
          max: 5000
          mode: slider
          step: 1
    button_2_long_loop:
      name: (Optional) Button 2 long press - loop until release
      description: Loop the button 2 action until the button is released.
      default: false
      selector:
        boolean:
    button_2_long_max_loop_repeats:
      name: (Optional) Button 2 long press - Maximum loop repeats
      description: >-
        Maximum number of repeats for the custom action, when looping is enabled.
        Use it as a safety limit to prevent an endless loop in case the corresponding stop event is not received.
      default: 500
      selector:
        number:
          min: 1
          max: 5000
          mode: slider
          step: 1
    button_3_long_loop:
      name: (Optional) Button 3 long press - loop until release
      description: Loop the button 3 action until the button is released.
      default: false
      selector:
        boolean:
    button_3_long_max_loop_repeats:
      name: (Optional) Button 3 long press - Maximum loop repeats
      description: >-
        Maximum number of repeats for the custom action, when looping is enabled.
        Use it as a safety limit to prevent an endless loop in case the corresponding stop event is not received.
      default: 500
      selector:
        number:
          min: 1
          max: 5000
          mode: slider
          step: 1
    button_4_long_loop:
      name: (Optional) Button 4 long press - loop until release
      description: Loop the button 4 action until the button is released.
      default: false
      selector:
        boolean:
    button_4_long_max_loop_repeats:
      name: (Optional) Button 4 long press - Maximum loop repeats
      description: >-
        Maximum number of repeats for the custom action, when looping is enabled.
        Use it as a safety limit to prevent an endless loop in case the corresponding stop event is not received.
      default: 500
      selector:
        number:
          min: 1
          max: 5000
          mode: slider
          step: 1
    # inputs for enabling double press events
    button_1_double_press:
      name: (Optional) Expose button 1 double press event
      description: Choose whether or not to expose the virtual double press event for button 1. Turn this on if you are providing an action for the button 1 double press event.
      default: false
      selector:
        boolean:
    button_2_double_press:
      name: (Optional) Expose button 2 double press event
      description: Choose whether or not to expose the virtual double press event for button 2. Turn this on if you are providing an action for the button 2 double press event.
      default: false
      selector:
        boolean:
    button_3_double_press:
      name: (Optional) Expose button 3 double press event
      description: Choose whether or not to expose the virtual double press event for button 3. Turn this on if you are providing an action for the button 3 double press event.
      default: false
      selector:
        boolean:
    button_4_double_press:
      name: (Optional) Expose button 4 double press event
      description: Choose whether or not to expose the virtual double press event for button 4. Turn this on if you are providing an action for the button 4 double press event.
      default: false
      selector:
        boolean:
    # helpers used to properly recognize the remote button events
    helper_double_press_delay:
      name: (Optional) Helper - Double Press delay
      description: Max delay between the first and the second button press for the double press event. Provide a value only if you are using a double press action. Increase this value if you notice that the double press action is not triggered properly.
      default: 500
      selector:
        number:
          min: 100
          max: 5000
          unit_of_measurement: milliseconds
          mode: box
          step: 10
    helper_debounce_delay:
      name: (Optional) Helper - Debounce delay
      description:
        Delay used for debouncing RAW controller events, by default set to 0. A value of 0 disables the debouncing feature. Increase this value if you notice custom actions or linked Hooks running multiple times when interacting with the device. When the controller needs to be debounced,
        usually a value of 100 is enough to remove all duplicate events.
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: milliseconds
          mode: box
          step: 10
# Automation schema
variables:
  # convert input tags to variables, to be used in templates
  integration: !input integration
  button_1_long_loop: !input button_1_long_loop
  button_1_long_max_loop_repeats: !input button_1_long_max_loop_repeats
  button_1_double_press: !input button_1_double_press
  button_2_long_loop: !input button_2_long_loop
  button_2_long_max_loop_repeats: !input button_2_long_max_loop_repeats
  button_2_double_press: !input button_2_double_press
  button_3_long_loop: !input button_3_long_loop
  button_3_long_max_loop_repeats: !input button_3_long_max_loop_repeats
  button_3_double_press: !input button_3_double_press
  button_4_long_loop: !input button_4_long_loop
  button_4_long_max_loop_repeats: !input button_4_long_max_loop_repeats
  button_4_double_press: !input button_4_double_press
  helper_last_controller_event: !input helper_last_controller_event
  helper_double_press_delay: !input helper_double_press_delay
  helper_debounce_delay: !input helper_debounce_delay
  # integration id used to select items in the action mapping
  integration_id: '{{ integration | lower }}'
  # adjusted debounce delay so that the resulting double press delay is exactly as specified by the user when running the action, taking also account of debouncing
  # make sure it never goes below the minimum double press delay
  adjusted_double_press_delay: '{{ [helper_double_press_delay - helper_debounce_delay, 100] | max }}'
  # mapping between actions and integrations
  actions_mapping:
    zigbee2mqtt:
      # source: https://www.zigbee2mqtt.io/devices/8719514440937_8719514440999.html
      button_1_short: [button_1_press, button_1_press_release]
      button_1_long: [button_1_hold]
      button_1_release: [button_1_hold_release]
      button_2_short: [button_2_press, button_2_press_release]
      button_2_long: [button_2_hold]
      button_2_release: [button_2_hold_release]
      button_3_short: [button_3_press, button_3_press_release]
      button_3_long: [button_3_hold]
      button_3_release: [button_3_hold_release]
      button_4_short: [button_4_press, button_4_press_release]
      button_4_long: [button_4_hold]
      button_4_release: [button_4_hold_release]
      dial_rotate_left_step: [dial_rotate_left_step]
      dial_rotate_left_slow: [dial_rotate_left_slow]
      dial_rotate_left_fast: [dial_rotate_left_fast]
      dial_rotate_right_step: [dial_rotate_right_step]
      dial_rotate_right_slow: [dial_rotate_right_slow]
      dial_rotate_right_fast: [dial_rotate_right_fast]
  # pre-choose actions for buttons based on configured integration
  # no need to perform this task at automation runtime
  button_1_short: '{{ actions_mapping[integration_id]["button_1_short"] }}'
  button_1_long: '{{ actions_mapping[integration_id]["button_1_long"] }}'
  button_1_release: '{{ actions_mapping[integration_id]["button_1_release"] }}'
  button_2_short: '{{ actions_mapping[integration_id]["button_2_short"] }}'
  button_2_long: '{{ actions_mapping[integration_id]["button_2_long"] }}'
  button_2_release: '{{ actions_mapping[integration_id]["button_2_release"] }}'
  button_3_short: '{{ actions_mapping[integration_id]["button_3_short"] }}'
  button_3_long: '{{ actions_mapping[integration_id]["button_3_long"] }}'
  button_3_release: '{{ actions_mapping[integration_id]["button_3_release"] }}'
  button_4_short: '{{ actions_mapping[integration_id]["button_4_short"] }}'
  button_4_long: '{{ actions_mapping[integration_id]["button_4_long"] }}'
  button_4_release: '{{ actions_mapping[integration_id]["button_4_release"] }}'
  dial_rotate_left_step: '{{ actions_mapping[integration_id]["dial_rotate_left_step"] }}'
  dial_rotate_left_slow: '{{ actions_mapping[integration_id]["dial_rotate_left_slow"] }}'
  dial_rotate_left_fast: '{{ actions_mapping[integration_id]["dial_rotate_left_fast"] }}'
  dial_rotate_right_step: '{{ actions_mapping[integration_id]["dial_rotate_right_step"] }}'
  dial_rotate_right_slow: '{{ actions_mapping[integration_id]["dial_rotate_right_slow"] }}'
  dial_rotate_right_fast: '{{ actions_mapping[integration_id]["dial_rotate_right_fast"] }}'
  # build data to send within a controller event
  controller_id: !input controller_device
mode: restart
max_exceeded: silent
triggers:
  # triggers for zigbee2mqtt mqtt device action - buttons
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_1_press
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_1_press_release
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_1_hold
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_1_hold_release
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_2_press
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_2_press_release
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_2_hold
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_2_hold_release
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_3_press
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_3_press_release
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_3_hold
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_3_hold_release
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_4_press
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_4_press_release
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_4_hold
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: button_4_hold_release
  # triggers for zigbee2mqtt mqtt device action - dial
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: dial_rotate_left_step
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: dial_rotate_left_slow
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: dial_rotate_left_fast
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: dial_rotate_right_step
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: dial_rotate_right_slow
  - trigger: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: dial_rotate_right_fast
conditions:
  - condition: and
    conditions:
      # check that the button event is not empty
      - >-
        {%- set trigger_action -%}
        {%- if integration_id == "zigbee2mqtt" -%}
        {{ trigger.payload }}
        {%- endif -%}
        {%- endset -%}
        {{ trigger_action not in ["","None"] }}
actions:
  # debouncing - when automation is triggered multiple times, the last automation run is the one which completes execution, due to mode restart
  # therefore previous runs must wait for the debounce delay before executing any other action
  # if the delay expires and the automation is still running it means it's the last run and execution can continue
  - delay:
      milliseconds: !input helper_debounce_delay
  # extract button event from the trigger
  # provide a single string value to check against
  - variables:
      trigger_action: >-
        {%- if integration_id == "zigbee2mqtt" -%}
        {{ trigger.payload }}
        {%- endif -%}
      deserialized_state: '{{ (states(helper_last_controller_event) | from_json) if helper_last_controller_event is not none and (states(helper_last_controller_event) | regex_match("^\{\s*?((\"a\":\s*?\".*\"|\"t\":\s*?\d+\.\d+)(,\s*?)?){2}\s*?\}$")) else {} }}'
      trigger_delta: '{{ (as_timestamp(now()) - (deserialized_state.t | default(0))) * 1000 }}'
  # update helper
  - action: input_text.set_value
    data:
      entity_id: !input helper_last_controller_event
      value: '{{ {"a":trigger_action,"t":as_timestamp(now())} | to_json }}'
  # choose the sequence to run based on the received button event
  - choose:
      # Button 1
      - conditions: '{{ trigger_action | string in button_1_short }}'
        sequence:
          - choose:
              # if double press event is enabled
              - conditions: '{{ button_1_double_press }}'
                sequence:
                  - choose:
                      # if previous event was a short press
                      - conditions: '{{ trigger_action | string == last_controller_event and trigger_delta | int <= helper_double_press_delay | int }}'
                        sequence:
                          # store the double press event in the last controller event helper
                          - action: input_text.set_value
                            data:
                              entity_id: !input helper_last_controller_event
                              value: '{{ {"a":"double_press_button_1","t":as_timestamp(now())} | to_json }}'
                          # run the double press action
                          # fire the event
                          - event: ahb_controller_event
                            event_data:
                              controller: '{{ controller_id }}'
                              action: button_1_double
                          # run the custom action
                          - choose:
                              - conditions: []
                                sequence: !input action_button_1_double
                    # previous event was not a short press
                    default:
                      # wait for the double press event to occur, within the provided delay
                      # if the second press is received, automation is restarted
                      - delay:
                          milliseconds: '{{ adjusted_double_press_delay }}'
                      # if delay expires, no second press was received, therefore run the short press action
                      # fire the event
                      - event: ahb_controller_event
                        event_data:
                          controller: '{{ controller_id }}'
                          action: button_1_short
                      # run the custom action
                      - choose:
                          - conditions: []
                            sequence: !input action_button_1_short
            # if double press event is disabled run the action for the single short press
            default:
              # fire the event
              - event: ahb_controller_event
                event_data:
                  controller: '{{ controller_id }}'
                  action: button_1_short
              # run the custom action
              - choose:
                  - conditions: []
                    sequence: !input action_button_1_short
      - conditions: '{{ trigger_action | string in button_1_long }}'
        sequence:
          # fire the event only once before looping the action
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_1_long
          - choose:
              # if looping is enabled, loop the action for a finite number of iterations
              - conditions: '{{ button_1_long_loop }}'
                sequence:
                  - repeat:
                      while: '{{ repeat.index < button_1_long_max_loop_repeats | int }}'
                      sequence: !input action_button_1_long
            # if looping is not enabled run the custom action only once
            default: !input action_button_1_long
      - conditions: '{{ trigger_action | string in button_1_release }}'
        sequence:
          # fire the event
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_1_release
          # run the custom action
          - choose:
              - conditions: []
                sequence: !input action_button_1_release
      # Button 2
      - conditions: '{{ trigger_action | string in button_2_short }}'
        sequence:
          - choose:
              # if double press event is enabled
              - conditions: '{{ button_2_double_press }}'
                sequence:
                  - choose:
                      # if previous event was a short press
                      - conditions: '{{ trigger_action | string == last_controller_event and trigger_delta | int <= helper_double_press_delay | int }}'
                        sequence:
                          - action: input_text.set_value
                            data:
                              entity_id: !input helper_last_controller_event
                              value: '{{ {"a":"double_press_button_2","t":as_timestamp(now())} | to_json }}'
                          - event: ahb_controller_event
                            event_data:
                              controller: '{{ controller_id }}'
                              action: button_2_double
                          - choose:
                              - conditions: []
                                sequence: !input action_button_2_double
                    default:
                      - delay:
                          milliseconds: '{{ adjusted_double_press_delay }}'
                      - event: ahb_controller_event
                        event_data:
                          controller: '{{ controller_id }}'
                          action: button_2_short
                      - choose:
                          - conditions: []
                            sequence: !input action_button_2_short
            default:
              - event: ahb_controller_event
                event_data:
                  controller: '{{ controller_id }}'
                  action: button_2_short
              - choose:
                  - conditions: []
                    sequence: !input action_button_2_short
      - conditions: '{{ trigger_action | string in button_2_long }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_2_long
          - choose:
              - conditions: '{{ button_2_long_loop }}'
                sequence:
                  - repeat:
                      while: '{{ repeat.index < button_2_long_max_loop_repeats | int }}'
                      sequence: !input action_button_2_long
            default: !input action_button_2_long
      - conditions: '{{ trigger_action | string in button_2_release }}'
        sequence:
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_2_release
          - choose:
              - conditions: []
                sequence: !input action_button_2_release
      # Button 3
      - conditions: '{{ trigger_action | string in button_3_short }}'
        sequence:
          - choose:
              - conditions: '{{ button_3_double_press }}'
                sequence:
                  - choose:
